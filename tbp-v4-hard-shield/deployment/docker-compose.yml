# TBP-V4.0 Docker Compose Deployment
# Complete stack with OPA and example applications
#issue10 fixed

version: '3.8'  # Corrigé : Version valide

services:
  # =============================================================================
  # Open Policy Agent (OPA) - Core Policy Engine
  # =============================================================================
  opa:
    image: openpolicyagent/opa:latest
    container_name: tbp-opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"  # FIXED: Bind to all interfaces
      - "--log-level=info"
      - "--log-format=json"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
      - ./data:/data
    networks:
      - tbp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # FastAPI Application - Example API with TBP Middleware
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tbp-api
    ports:
      - "8000:8000"
    environment:
      - OPA_URL=http://opa:8181
      - AGENT_ID=docker-api-001
    depends_on:
      opa:
        condition: service_healthy
    networks:
      - tbp-network
    restart: unless-stopped

  # =============================================================================
  # Monitoring - Prometheus (Optional)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tbp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - tbp-network
    restart: unless-stopped
    profiles:
      - monitoring

  # =============================================================================
  # Grafana - Dashboards (Optional)
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: tbp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tbp-network
    restart: unless-stopped
    profiles:
      - monitoring

  # =============================================================================
  # Audit Log Storage - PostgreSQL (Optional)
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: tbp-postgres
    environment:
      - POSTGRES_DB=tbp_audit
      - POSTGRES_USER=tbp
      - POSTGRES_PASSWORD=tbp_secure_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tbp-network
    restart: unless-stopped
    profiles:
      - audit

networks:
  tbp-network:
    driver: bridge

volumes:  
  prometheus-data:
  grafana-data:
  postgres-data:
