# TBP LimitRange
# Sets default resource constraints for containers in tbp-system namespace
# Ensures no container runs without resource limits (prevents OOM kills)

apiVersion: v1
kind: LimitRange
metadata:
  name: tbp-limit-range
  namespace: tbp-system
  labels:
    app.kubernetes.io/name: tbp-limit-range
    app.kubernetes.io/component: resource-management
    app.kubernetes.io/part-of: tbp-system
spec:
  limits:
    # Container-level limits
    - type: Container
      # Default limits applied if not specified
      default:
        cpu: 500m              # 0.5 CPU cores
        memory: 512Mi          # 512 MiB (prevents OOM)
      # Default requests applied if not specified
      defaultRequest:
        cpu: 100m              # 0.1 CPU cores
        memory: 128Mi          # 128 MiB
      # Minimum resources per container
      min:
        cpu: 50m               # 0.05 CPU cores minimum
        memory: 64Mi           # 64 MiB minimum
      # Maximum resources per container
      max:
        cpu: "1"               # 1 CPU core maximum
        memory: 1Gi            # 1 GiB maximum
      # Maximum ratio of limit/request
      maxLimitRequestRatio:
        cpu: "10"              # Limit can be up to 10x request
        memory: "4"            # Limit can be up to 4x request (prevents OOM)

    # Pod-level limits
    - type: Pod
      max:
        cpu: "2"               # 2 CPU cores max per pod
        memory: 2Gi            # 2 GiB max per pod
      min:
        cpu: 50m               # Minimum CPU per pod
        memory: 64Mi           # Minimum memory per pod

    # PersistentVolumeClaim limits
    - type: PersistentVolumeClaim
      min:
        storage: 100Mi         # Minimum PVC size
      max:
        storage: 10Gi          # Maximum PVC size
