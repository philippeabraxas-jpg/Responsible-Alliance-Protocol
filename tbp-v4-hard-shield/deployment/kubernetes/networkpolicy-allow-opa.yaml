# TBP NetworkPolicy - Allow OPA API Access
# Permits authorized pods to access the OPA policy engine
# Only pods with the label 'tbp-client: "true"' can communicate with OPA
# This implements the "authorized API calls only" requirement from Issue #4

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opa-api
  namespace: tbp-system
  labels:
    app.kubernetes.io/name: allow-opa-api
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: tbp-system
  annotations:
    description: "Allow authorized clients to access OPA API on port 8181"
spec:
  # Apply to OPA pods only
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opa
  
  policyTypes:
    - Ingress
  
  ingress:
    # Allow from pods with tbp-client label (any namespace)
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              tbp-client: "true"
      ports:
        - protocol: TCP
          port: 8181

---
# Allow OPA pods to communicate with each other (for potential clustering)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opa-internal
  namespace: tbp-system
  labels:
    app.kubernetes.io/name: allow-opa-internal
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: tbp-system
  annotations:
    description: "Allow OPA pods to communicate with each other"
spec:
  # Apply to OPA pods
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opa
  
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    # Allow from other OPA pods in the same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opa
      ports:
        - protocol: TCP
          port: 8181
  
  egress:
    # Allow to other OPA pods in the same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opa
      ports:
        - protocol: TCP
          port: 8181

---
# Allow health checks from the kubelet (required for probes)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-checks
  namespace: tbp-system
  labels:
    app.kubernetes.io/name: allow-health-checks
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: tbp-system
  annotations:
    description: "Allow kubelet health checks to OPA pods"
spec:
  # Apply to OPA pods
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opa
  
  policyTypes:
    - Ingress
  
  ingress:
    # Allow health check traffic from nodes (kubelet)
    # This uses ipBlock to allow node CIDR - adjust for your cluster
    - ports:
        - protocol: TCP
          port: 8181
      # Note: In production, you may need to adjust this based on your cluster's node CIDR
      # For kind/minikube, the default node network is typically allowed automatically
