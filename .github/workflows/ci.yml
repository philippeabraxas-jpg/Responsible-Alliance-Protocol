name: TBP v4.2.1 CI

on:
  push:
    branches: [ main, develop, v4.2-dev ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.55.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black mypy pytest pytest-cov
          pip install -r tbp-v4-hard-shield/requirements.txt
          pip install -r tbp-v4-hard-shield/requirements-test.txt

      - name: Lint with Black
        run: black --check tbp-v4-hard-shield/

      - name: Run OPA Validation
        run: opa check tbp-v4-hard-shield/policy_engine/

      - name: Run Automated Validation (E2E + Performance)
        run: |
          cd tbp-v4-hard-shield
          python tests/validate_v42.py
