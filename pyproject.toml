[project]
name = "tbp-hard-shield"
version = "4.2.1"
description = "Teleological Bounding Protocol - Shield Hardening Edition"
dependencies = [
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "python-pkcs11>=0.7.0",
    "asn1crypto>=1.5.1",
    "prometheus-client>=0.17.0"
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
